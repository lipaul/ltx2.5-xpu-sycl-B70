[project]
name = "ltx-core"
version = "1.2.0"
description = "Core implementation of Lightricks' LTX-2 model"
readme = "README.md"
# XPU torch pins triton-xpu==3.7.2, which has no free-threaded 3.14 (cp314t)
# Windows wheel; bounding the supported range keeps the universal lock resolvable.
requires-python = ">=3.10,<3.14"
dependencies = [
    # torch 2.13.0+xpu links libsycl.so.9 (oneAPI 2026.0), which the current
    # Intel Graphics driver accepts for ESIMD device code -- torch 2.12.0+xpu
    # (libsycl.so.8, oneAPI 2025.3) is rejected with "invalid api option".
    "torch==2.13.0+xpu",
    "torchaudio==2.11.0+xpu",
    # Required transitively by transformers' Gemma 4 image processor, but absent
    # from the lockfile. 0.28.0 is the ABI-matched build for torch 2.13.0.
    "torchvision==0.28.0+xpu",
    # torch 2.13.0+xpu pins triton-xpu==3.7.2; it is also published on PyPI at a
    # conflicting version, so declare it here (direct dep) to force the XPU index.
    "triton-xpu==3.7.2; sys_platform == 'linux'",
    "einops",
    "numpy",
    "av",
    # Upper bound: transformers 5.15.0 routes config attribute access through the
    # heterogeneity layer, which raises AmbiguousGlobalPerLayerAttributeError on global
    # `config.head_dim` -- but its own gemma4_unified model code still reads it that way
    # (modeling_gemma4_unified.py, compute_default_rope_parameters), so the Gemma 4 text
    # encoder cannot be built at all. 5.14.1 is the newest release verified working.
    "transformers>=5.8.0,<5.15",
    "safetensors",
    "accelerate",
    "scipy>=1.14",
    # Apple Silicon only: Apple's fused MPSGraph SDPA, the AUTOMATIC attention
    # backend on MPS. The marker installs it on Apple Silicon and prunes it
    # everywhere else (Linux/XPU), so it is a hard requirement exactly where it
    # is the only viable attention kernel.
    "mps-sdpa>=0.2.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = { index = "xpu" }
torchaudio = { index = "xpu" }
torchvision = { index = "xpu" }
triton-xpu = { index = "xpu" }

[[tool.uv.index]]
name = "xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "scikit-image>=0.25.2",
]
